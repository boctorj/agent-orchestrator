# dnsmasq config for orchestrator worker containers (F-001-U-3).
#
# Launched by scripts/run-worker-dns.sh on 127.0.0.1:5353. Worker
# containers attach via `--dns=127.0.0.1 --dns-search=.` (wired up
# in orchestrator/workers/docker_claude_code.py).
#
# Mirrors ALLOWED_NETWORK_HOSTS (defined in
# orchestrator/workers/managed_agent.py) plus the public package-manager
# hosts the F-001-U-3 unit description names. Anything not allowlisted
# resolves to 0.0.0.0 — a non-routable address that fails connect.
#
# SOFT BOUNDARY: this is DNS-level filtering, NOT a kernel-side egress
# rule. A worker that hardcodes a raw IP can still reach it. Use this
# as defense-in-depth against named-host exfiltration; do not treat
# it as an isolation guarantee. See SECURITY.md "Non-defenses" and
# docs/PROPOSAL-docker-workers.md "Network policy" for the full
# threat-model context.

# ---- daemon binding ----
listen-address=127.0.0.1
port=5353
bind-interfaces

# Don't read /etc/resolv.conf or /etc/hosts — we control upstream
# explicitly via the per-host server= lines below.
no-resolv
no-hosts

# ---- allowlist (per-host upstream resolution) ----
# Mirrors ALLOWED_NETWORK_HOSTS in orchestrator/workers/managed_agent.py
# Each entry forwards that host (and subdomains) to Cloudflare DNS
# (1.1.1.1) rather than embedding pinned IPs that drift over time.
server=/github.com/1.1.1.1
server=/api.github.com/1.1.1.1
server=/codeload.github.com/1.1.1.1
server=/objects.githubusercontent.com/1.1.1.1
server=/raw.githubusercontent.com/1.1.1.1
server=/api.anthropic.com/1.1.1.1

# Package-manager hosts named in the F-001-U-3 unit description.
server=/pypi.org/1.1.1.1
server=/files.pythonhosted.org/1.1.1.1
server=/registry.npmjs.org/1.1.1.1

# ---- default-deny ----
# Any host not matched by a server= line above gets 0.0.0.0 — the
# downstream socket connect will fail (non-routable address). This is
# dnsmasq's wildcard-domain syntax: address=/#/<ip> matches anything
# the per-host server= lines didn't claim.
address=/#/0.0.0.0
