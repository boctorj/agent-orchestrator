name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # Static analysis + tests across OS × Python matrix.
  # Pre-commit (ruff lint/format + file hygiene) runs inside the
  # matrix so every OS/Python combo enforces the same gates a
  # developer's local `pre-commit` hook would.
  # ----------------------------------------------------------------
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pre-commit hooks (ruff lint/format + file hygiene)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Type check (mypy)
        run: mypy

      - name: Security scan (bandit)
        run: bandit -r orchestrator -c pyproject.toml

      - name: Tests (pytest with 80% coverage gate)
        run: pytest --cov-fail-under=80

  # ----------------------------------------------------------------
  # Dependency CVE scan — warning-only for now (doesn't block PRs)
  # so it surfaces issues without blocking unrelated work.
  # ----------------------------------------------------------------
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install + run pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit
          pip-audit --strict || echo "::warning::pip-audit found issues; review and patch"
